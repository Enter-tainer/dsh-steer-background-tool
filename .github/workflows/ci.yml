name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 itself requires Node >= 22.13, which is why Node 20 runs in the
        # dependency-free `runtime` job below instead of here.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A bundle's real failure mode is a wrong path in package.json, not a
      # syntax error: Plugin Manager reads the icon and locale from disk and the
      # Loader reads dsh.bundle.patch without ever running the plugin.
      - name: Bundle contract
        run: pnpm run validate

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm test

  runtime:
    name: runtime (Node ${{ matrix.node }}, no dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # index.js has no imports and there is no build step, so the shipped
      # artifact must work on the oldest supported Node with nothing installed.
      - name: Nothing is installed
        run: |
          test ! -d node_modules || { echo "::error::node_modules must not exist"; exit 1; }

      - name: Bundle contract
        run: node scripts/validate.mjs

      - name: Unit tests
        run: node --test test/*.mjs

  package:
    name: packaged contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack
        run: pnpm pack

      # Installing the bundle must not depend on dev files or on files that were
      # left out of `files`, so assert the runtime contract is inside the tarball.
      - name: Verify tarball carries the runtime contract
        run: |
          set -euo pipefail
          tarball=$(ls ./*.tgz)
          echo "tarball: $tarball"
          listing=$(tar -tzf "$tarball")
          printf '%s\n' "$listing"
          missing=0
          for required in \
            package/package.json \
            package/index.js \
            package/cordis.patch.yml \
            package/icon.svg \
            package/locale/en.json \
            package/locale/zh.json \
            package/README.md \
            package/LICENSE
          do
            # No pipe here on purpose: `tar | grep -q` trips `pipefail` through
            # SIGPIPE as soon as grep exits early.
            if ! grep -qx "$required" <<<"$listing"; then
              echo "::error::tarball is missing $required"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "all required entries present"

      - name: Validate the unpacked artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/packed
          tar -xzf ./*.tgz -C /tmp/packed
          node scripts/check-pack.mjs /tmp/packed/package
